<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍔 مطعمي</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Tahoma,sans-serif;
  background:#151515;
}
button{
  border:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#202020;
}

/* ================= شاشة الغلاف ================= */
#cover{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,#ffd76b,#d87918 42%,#7a260d 100%);
}
.coverBox{
  width:min(92%,430px);
  text-align:center;
  color:white;
  padding:28px 20px;
  border-radius:30px;
  background:rgba(60,20,5,.55);
  box-shadow:0 20px 60px #0009;
}
.bigBurger{
  font-size:110px;
  filter:drop-shadow(0 12px 8px #0008);
  animation:bob 1.5s infinite ease-in-out;
}
@keyframes bob{
  50%{transform:translateY(-10px) rotate(-2deg)}
}
.coverBox h1{
  font-size:42px;
  margin:5px 0;
}
.coverBox p{
  font-size:18px;
  margin:8px 0 22px;
}
.start{
  width:90%;
  padding:16px;
  border-radius:18px;
  font-size:23px;
  font-weight:bold;
  background:#ffcc32;
  color:#4b2305;
  box-shadow:0 6px 0 #a65d08;
}

/* ================= واجهة اللعبة ================= */
#hud{
  position:absolute;
  top:0;
  right:0;
  left:0;
  z-index:20;
  min-height:58px;
  padding:7px;
  display:flex;
  gap:7px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  background:#32190ddd;
  color:white;
}
.info{
  background:#ffffff18;
  border:1px solid #ffffff33;
  padding:7px 10px;
  border-radius:12px;
  font-size:14px;
}
.hudBtn{
  min-width:44px;
  min-height:42px;
  border-radius:12px;
  background:#ffcc32;
  font-size:20px;
}

/* ================= العالم ================= */
#viewport{
  position:absolute;
  top:58px;
  bottom:0;
  left:0;
  right:0;
  overflow:hidden;
  touch-action:none;
}
#world{
  position:absolute;
  width:1800px;
  height:1000px;
  left:0;
  top:0;
  transform:translate(0,0);
  background:#d6b98b;
}

/* الأرض */
.floor{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
    #d8bc91;
  background-size:70px 70px;
}
.wallTop{
  position:absolute;
  left:0;
  top:0;
  width:1800px;
  height:95px;
  background:#9b5531;
}
.street{
  position:absolute;
  left:0;
  top:810px;
  width:1800px;
  height:190px;
  background:#555;
}
.streetLine{
  position:absolute;
  left:0;
  right:0;
  top:895px;
  height:12px;
  background:#e8c642;
}

/* ================= المناطق ================= */
.area{
  position:absolute;
  border:6px solid #704020;
  border-radius:25px;
  background:#f4dfb8;
  box-shadow:0 10px 25px #0003;
}
.areaTitle{
  position:absolute;
  top:12px;
  right:15px;
  padding:8px 13px;
  border-radius:12px;
  background:#4b2412;
  color:white;
  font-size:22px;
  font-weight:bold;
}

/* المطبخ */
#kitchen{
  left:50px;
  top:125px;
  width:600px;
  height:430px;
}
.stove{
  position:absolute;
  left:55px;
  top:120px;
  width:180px;
  height:115px;
  border-radius:15px;
  background:#444;
  border:7px solid #222;
}
.fire{
  position:absolute;
  font-size:48px;
  left:62px;
  top:20px;
  animation:fire 0.45s infinite alternate;
}
@keyframes fire{
  to{transform:scale(1.15)}
}
.counter{
  position:absolute;
  right:40px;
  top:120px;
  width:330px;
  height:100px;
  border-radius:15px;
  background:#9a5b32;
  border:6px solid #61331d;
}
.plate{
  position:absolute;
  right:125px;
  top:25px;
  font-size:60px;
}
.fridge{
  position:absolute;
  left:270px;
  bottom:30px;
  font-size:75px;
}

/* المتجر */
#store{
  left:720px;
  top:125px;
  width:330px;
  height:280px;
}
.shelf{
  position:absolute;
  top:80px;
  right:30px;
  left:30px;
  height:130px;
  border:8px solid #704020;
  background:#bd8150;
  font-size:45px;
  display:flex;
  align-items:center;
  justify-content:space-around;
}
.storeBuy{
  position:absolute;
  bottom:20px;
  left:25px;
  right:25px;
  padding:12px;
  border-radius:12px;
  background:#ffca2c;
  font-weight:bold;
  font-size:16px;
}

/* التطوير */
#upgrade{
  left:1120px;
  top:125px;
  width:300px;
  height:280px;
}
.upgrades{
  margin:80px 20px 0;
  display:grid;
  gap:10px;
}
.upgrades button{
  padding:11px;
  border-radius:12px;
  background:#e6b738;
  font-weight:bold;
}

/* الكاشير */
#cashier{
  left:1480px;
  top:125px;
  width:270px;
  height:280px;
}
.cashDesk{
  position:absolute;
  left:30px;
  right:30px;
  top:100px;
  height:100px;
  background:#77421f;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
}

/* ================= الصالة ================= */
#dining{
  left:700px;
  top:450px;
  width:1050px;
  height:330px;
  background:#ead1a0;
}
.table{
  position:absolute;
  width:150px;
  height:90px;
  border-radius:50%;
  background:#8b542d;
  border:6px solid #60351e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
}
.t1{left:70px;top:80px}
.t2{left:300px;top:170px}
.t3{left:550px;top:80px}
.t4{left:780px;top:170px}

.customer{
  position:absolute;
  font-size:55px;
  z-index:4;
  transition:transform .15s linear;
}
.c1{left:120px;top:160px}
.c2{left:350px;top:70px}
.c3{left:600px;top:160px}
.c4{left:830px;top:70px}

.orderBubble{
  position:absolute;
  top:-42px;
  right:-10px;
  background:white;
  border:3px solid #65361c;
  padding:5px 9px;
  border-radius:12px;
  font-size:15px;
}

/* ================= اللاعب ================= */
#player{
  position:absolute;
  width:70px;
  height:80px;
  z-index:15;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:57px;
  filter:drop-shadow(0 5px 3px #0005);
  transition:transform .04s linear;
}
#player.carrying:after{
  content:"🍔";
  position:absolute;
  font-size:30px;
  top:-15px;
  right:-5px;
}

/* ================= أزرار الحركة ================= */
#movePad{
  position:absolute;
  z-index:30;
  left:12px;
  bottom:12px;
  width:165px;
  height:165px;
}
.move{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:15px;
  background:#4a2716dd;
  color:white;
  font-size:25px;
  border:2px solid #ffffff55;
}
.up{left:56px;top:0}
.down{left:56px;bottom:0}
.left{left:0;top:56px}
.right{right:0;top:56px}
.center{left:56px;top:56px;background:#d28a22}

/* زر التفاعل */
#action{
  position:absolute;
  z-index:30;
  right:18px;
  bottom:28px;
  width:125px;
  height:58px;
  border-radius:18px;
  background:#ffca2c;
  color:#4b2305;
  font-size:19px;
  font-weight:bold;
}

/* رسالة */
#message{
  position:absolute;
  z-index:40;
  left:50%;
  top:75px;
  transform:translateX(-50%);
  background:#fff;
  color:#32190d;
  padding:10px 16px;
  border-radius:14px;
  box-shadow:0 5px 15px #0004;
  font-weight:bold;
  opacity:0;
  transition:.25s;
  pointer-events:none;
}
#message.show{opacity:1}

/* شاشة إيقاف */
#pauseScreen{
  position:absolute;
  inset:0;
  z-index:45;
  background:#0009;
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.pauseBox{
  background:#4b2817;
  padding:30px;
  border-radius:25px;
}
.pauseBox button{
  margin-top:15px;
  padding:13px 30px;
  border-radius:13px;
  background:#ffca2c;
  font-size:18px;
}

/* موبايل */
@media(max-width:600px){
  #hud{font-size:12px}
  .info{padding:6px 8px}
  .areaTitle{font-size:18px}
}
</style>
</head>

<body>

<div id="game">

<!-- الغلاف -->
<div id="cover">
  <div class="coverBox">
    <div class="bigBurger">🍔</div>
    <h1>مطعمي</h1>
    <p>ابدأ يومك في مطعم البرجر!</p>
    <button class="start" id="startBtn">▶ ابدأ اللعبة</button>
  </div>
</div>

<!-- المعلومات -->
<div id="hud">
  <div class="info">💰 <span id="money">150</span> جنيه</div>
  <div class="info">⭐ <span id="score">0</span></div>
  <div class="info">🍔 الطلبات: <span id="served">0</span></div>
  <div class="info">📍 <span id="location">المطبخ</span></div>
  <button class="hudBtn" id="pauseBtn">⏸️</button>
</div>

<div id="viewport">
  <div id="world">

    <div class="floor"></div>
    <div class="wallTop"></div>

    <!-- المطبخ -->
    <div class="area" id="kitchen">
      <div class="areaTitle">👨‍🍳 المطبخ</div>
      <div class="stove">
        <div class="fire">🔥</div>
      </div>
      <div class="counter">
        <div class="plate">🍔</div>
      </div>
      <div class="fridge">🧊</div>
    </div>

    <!-- المتجر -->
    <div class="area" id="store">
      <div class="areaTitle">🛒 المتجر</div>
      <div class="shelf">🍞 🥩 🧀 🍅</div>
      <button class="storeBuy" id="buyBtn">شراء مكونات - 20 جنيه</button>
    </div>

    <!-- التطوير -->
    <div class="area" id="upgrade">
      <div class="areaTitle">⬆️ التطوير</div>
      <div class="upgrades">
        <button data-upgrade="المطبخ">🔥 تطوير المطبخ - 50</button>
        <button data-upgrade="الفرن">♨️ تطوير الفرن - 70</button>
        <button data-upgrade="الصالة">🪑 تطوير الصالة - 60</button>
      </div>
    </div>

    <!-- الكاشير -->
    <div class="area" id="cashier">
      <div class="areaTitle">💵 الكاشير</div>
      <div class="cashDesk">💰</div>
    </div>

    <!-- الصالة -->
    <div class="area" id="dining">
      <div class="areaTitle">🍽️ صالة الزبائن</div>

      <div class="table t1">🍽️</div>
      <div class="table t2">🍽️</div>
      <div class="table t3">🍽️</div>
      <div class="table t4">🍽️</div>

      <div class="customer c1">🧑<div class="orderBubble">🍔</div></div>
      <div class="customer c2">👩<div class="orderBubble">🍔</div></div>
      <div class="customer c3">🧔<div class="orderBubble">🍔</div></div>
      <div class="customer c4">👨<div class="orderBubble">🍔</div></div>
    </div>

    <!-- اللاعب -->
    <div id="player">👨‍🍳</div>

    <div class="street"></div>
    <div class="streetLine"></div>
  </div>

  <!-- التحكم -->
  <div id="movePad">
    <button class="move up" data-dy="-1">⬆️</button>
    <button class="move down" data-dy="1">⬇️</button>
    <button class="move left" data-dx="-1">⬅️</button>
    <button class="move right" data-dx="1">➡️</button>
    <button class="move center">👨‍🍳</button>
  </div>

  <button id="action">🍔 تفاعل</button>
</div>

<div id="message"></div>

<!-- إيقاف -->
<div id="pauseScreen">
  <div class="pauseBox">
    <h2>⏸️ اللعبة متوقفة</h2>
    <p>اضغط متابعة للرجوع للمطعم</p>
    <button id="resumeBtn">▶ متابعة</button>
  </div>
</div>

<script>
(function(){

  const world = document.getElementById("world");
  const player = document.getElementById("player");
  const viewport = document.getElementById("viewport");

  const moneyEl = document.getElementById("money");
  const scoreEl = document.getElementById("score");
  const servedEl = document.getElementById("served");
  const locationEl = document.getElementById("location");
  const message = document.getElementById("message");

  const cover = document.getElementById("cover");
  const pauseScreen = document.getElementById("pauseScreen");

  let x = 150;
  let y = 220;

  let money = 150;
  let score = 0;
  let served = 0;

  let paused = false;
  let started = false;
  let carrying = false;

  const speed = 7;

  function say(text){
    message.textContent = text;
    message.classList.add("show");

    clearTimeout(window.msgTimer);
    window.msgTimer = setTimeout(function(){
      message.classList.remove("show");
    },1800);
  }

  function updatePlayer(){

    player.style.left = x + "px";
    player.style.top = y + "px";

    /*
      نحرك الكاميرا مع اللاعب.
      العالم أكبر من شاشة الموبايل،
      وبالتالي تستطيع التجول داخله في كل الاتجاهات.
    */

    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;

    let cameraX = -(x - vw/2);
    let cameraY = -(y - vh/2);

    const minX = vw - 1800;
    const minY = vh - 1000;

    cameraX = Math.max(minX, Math.min(0,cameraX));
    cameraY = Math.max(minY, Math.min(0,cameraY));

    world.style.transform =
      "translate(" + cameraX + "px," + cameraY + "px)";

    updateLocation();
  }

  function updateLocation(){

    let place = "المطعم";

    if(x < 650 && y < 560){
      place = "👨‍🍳 المطبخ";
    }

    if(x >= 650 && x < 1080 && y < 450){
      place = "🛒 المتجر";
    }

    if(x >= 1080 && x < 1450 && y < 450){
      place = "⬆️ التطوير";
    }

    if(x >= 1450 && y < 450){
      place = "💵 الكاشير";
    }

    if(y >= 440 && x >= 650){
      place = "🍽️ صالة الزبائن";
    }

    locationEl.textContent = place;
  }

  function move(dx,dy){

    if(!started || paused) return;

    x += dx * speed;
    y += dy * speed;

    x = Math.max(10,Math.min(1730,x));
    y = Math.max(100,Math.min(900,y));

    updatePlayer();
  }

  /* أزرار الحركة */
  document.querySelectorAll(".move").forEach(function(btn){

    if(btn.classList.contains("center")) return;

    let timer = null;

    function begin(e){
      e.preventDefault();

      const dx = Number(btn.dataset.dx || 0);
      const dy = Number(btn.dataset.dy || 0);

      move(dx,dy);

      clearInterval(timer);
      timer = setInterval(function(){
        move(dx,dy);
      },55);
    }

    function end(){
      clearInterval(timer);
      timer = null;
    }

    btn.addEventListener("pointerdown",begin);
    btn.addEventListener("pointerup",end);
    btn.addEventListener("pointercancel",end);
    btn.addEventListener("pointerleave",end);
  });

  /* لوحة المفاتيح */
  document.addEventListener("keydown",function(e){

    if(!started || paused) return;

    if(e.key === "ArrowLeft") move(-1,0);
    if(e.key === "ArrowRight") move(1,0);
    if(e.key === "ArrowUp") move(0,-1);
    if(e.key === "ArrowDown") move(0,1);
  });

  /* البداية */
  document.getElementById("startBtn").addEventListener("click",function(){

    started = true;
    cover.style.display = "none";

    say("🍔 أهلاً بك! تحرك داخل المطعم");

    updatePlayer();
  });

  /* إيقاف */
  document.getElementById("pauseBtn").addEventListener("click",function(){

    if(!started) return;

    paused = true;
    pauseScreen.style.display = "flex";
  });

  /* متابعة */
  document.getElementById("resumeBtn").addEventListener("click",function(){

    paused = false;
    pauseScreen.style.display = "none";
  });

  /* شراء */
  document.getElementById("buyBtn").addEventListener("click",function(){

    if(money < 20){
      say("❌ لا يوجد مال كافٍ");
      return;
    }

    money -= 20;
    moneyEl.textContent = money;

    say("🛒 تم شراء مكونات البرجر");
  });

  /* التطوير */
  document.querySelectorAll("[data-upgrade]").forEach(function(btn){

    btn.addEventListener("click",function(){

      const cost = 50;

      if(money < cost){
        say("❌ المال غير كافٍ للتطوير");
        return;
      }

      money -= cost;
      moneyEl.textContent = money;
      score += 10;
      scoreEl.textContent = score;

      say("⬆️ تم تطوير " + btn.dataset.upgrade);
    });
  });

  /* زر التفاعل */
  document.getElementById("action").addEventListener("click",function(){

    if(!started || paused) return;

    /*
      لو اللاعب في المطبخ:
      يجهز برجر.
    */
    if(x < 650 && y < 560){

      if(carrying){
        say("🍔 معك برجر جاهز");
      }else{
        carrying = true;
        player.classList.add("carrying");
        say("🔥 تم تجهيز البرجر! خذه للزبون");
      }

      return;
    }

    /*
      لو في الصالة ومعه برجر:
      يسلم الطلب.
    */
    if(y >= 440 && x >= 650){

      if(!carrying){
        say("📋 الزبون ينتظر البرجر");
        return;
      }

      carrying = false;
      player.classList.remove("carrying");

      money += 35;
      score += 20;
      served++;

      moneyEl.textContent = money;
      scoreEl.textContent = score;
      servedEl.textContent = served;

      say("🎉 تم تسليم الطلب +35 جنيه");

      return;
    }

    /*
      المتجر
    */
    if(x >= 650 && x < 1080 && y < 450){

      say("🛒 اقترب من المتجر واضغط شراء");
      return;
    }

    /*
      الكاشير
    */
    if(x >= 1450 && y < 450){

      say("💵 الكاشير جاهز للحساب");
      return;
    }

    /*
      التطوير
    */
    if(x >= 1080 && x < 1450 && y < 450){

      say("⬆️ اختار تطوير من لوحة التطوير");
      return;
    }

    say("🚶 تحرك داخل المطعم واستكشف الأماكن");
  });

  updatePlayer();

})();
</script>

</body>
</html>
